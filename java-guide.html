  var form = document.getElementById("f"), input = document.getElementById("pw"),
      goBtn = document.getElementById("go"), errBox = document.getElementById("err"),
      remember = document.getElementById("rm");

  function unb(s) { var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
  function toB64(bytes) { var s = ""; for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s); }

  function ckKey(ckB64) {
    return crypto.subtle.importKey("raw", unb(ckB64), { name: "AES-GCM" }, false, ["decrypt"]);
  }
  function decryptWith(key, ivB64, ctB64) {
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: unb(ivB64) }, key, unb(ctB64));
  }

  /* open the page: hand the key to the decrypted page, then write it in */
  function render(ckB64, plain) {
    window.CodeGuidesUnlock = {
      decryptBytes: function (buf) {          // buf = 12-byte nonce followed by the ciphertext
        return ckKey(ckB64).then(function (k) {
          return crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, k, buf.slice(12));
        }).then(function (pt) { return new Uint8Array(pt); });
      }
    };
    document.open();
    document.write(plain);
    document.close();
  }

  function openWith(ckB64) {
    return ckKey(ckB64)
      .then(function (k) { return decryptWith(k, P.nonce, P.ct); })
      .then(function (pt) {
        try { sessionStorage.setItem("cgk", ckB64); } catch (e) {}
        render(ckB64, new TextDecoder().decode(pt));
        return true;
      })
      .catch(function () { return false; });
  }

  function tryPassword(pw) {
    var i = 0;
    function next() {
      if (i >= P.f.length) return Promise.resolve(null);
      var slot = P.f[i++];
      return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"])
        .then(function (base) {
          return crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: unb(slot.s), iterations: P.it, hash: "SHA-256" },
            base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
        })
        .then(function (dk) {
          var blob = unb(slot.k);
          return crypto.subtle.decrypt({ name: "AES-GCM", iv: blob.slice(0, 12) }, dk, blob.slice(12));
        })
        .then(function (ck) { return toB64(new Uint8Array(ck)); })
        .catch(function () { return next(); });
    }
    return next();
  }

  /* document.write only replaces the page once parsing has finished; if we do
     it while the parser is still running the content is appended instead, so
     always wait for the load event first. */
  function whenLoaded(fn) {
    if (document.readyState === "complete") fn();
    else window.addEventListener("load", fn, { once: true });
  }

  var cached = null;
  try { cached = sessionStorage.getItem("cgk") || localStorage.getItem("cgk") || null; } catch (e) {}

  if (cached) {
    whenLoaded(function () {
      openWith(cached).then(function (ok) {
        if (!ok) { try { sessionStorage.removeItem("cgk"); } catch (e) {} input.focus(); }
      });
    });
  }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var pw = input.value;
    if (!pw) return;
    errBox.textContent = "";
    goBtn.disabled = true;
    goBtn.textContent = "Unlocking…";
    tryPassword(pw).then(function (ck) {
      if (!ck) {
        goBtn.disabled = false; goBtn.textContent = "Unlock";
        errBox.textContent = "That password is not valid for this site.";
        input.select();
        return;
      }
      try {
        if (remember.checked) localStorage.setItem("cgk", ck);
        else localStorage.removeItem("cgk");
      } catch (e) {}
      whenLoaded(function () {
        openWith(ck).then(function (ok) {
          if (!ok) { goBtn.disabled = false; goBtn.textContent = "Unlock"; errBox.textContent = "Could not open the page — try again."; }
        });
      });
    });
  });
})();
